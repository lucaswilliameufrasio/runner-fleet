services:
  fleet:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command: [serve, --data, /data, --web, /app/web, --listen, '0.0.0.0:8080', --origin, '${RF_ORIGIN}', --agent-url, '${RF_AGENT_URL}', --agent-listen, ':8443', --tls-cert, /tls/fullchain.pem, --tls-key, /tls/privkey.pem]
    ports:
      - '127.0.0.1:8080:8080'
      - '127.0.0.1:8443:8443'
    volumes:
      - ./data:/data
      - ./tls:/tls:ro
      - ../web/build/downloads:/app/web/downloads:ro
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
