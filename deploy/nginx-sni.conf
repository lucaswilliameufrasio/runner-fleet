# Example top-level nginx.conf. Requires ngx_stream_ssl_preread_module.
# Replace domains and cert paths. Both hostnames resolve to this server.
events {}
stream {
  map $ssl_preread_server_name $fleet_upstream {
    fleet.example.com 127.0.0.1:9443;
    agents.example.com 127.0.0.1:8443;
    default 127.0.0.1:9443;
  }
  server {
    listen 443;
    ssl_preread on;
    proxy_pass $fleet_upstream;
    proxy_timeout 650s;
  }
}
http {
  server {
    listen 127.0.0.1:9443 ssl;
    server_name fleet.example.com;
    ssl_certificate /etc/letsencrypt/live/fleet.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fleet.example.com/privkey.pem;
    client_max_body_size 2m;
    location / {
      proxy_pass http://127.0.0.1:8080;
      proxy_set_header Host $host;
      proxy_buffering off;
      proxy_read_timeout 650s;
    }
  }
}
