# Panel and bootstrap endpoint. Replace the hostname and certificate paths.
server {
  listen 443 ssl;
  server_name fleet.example.com;
  ssl_certificate /etc/letsencrypt/live/fleet.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/fleet.example.com/privkey.pem;
  client_max_body_size 2m;
  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 650s;
  }
}
# Agents connect directly to :8443, where Go validates individual client certificates.
# To use 443 for both surfaces, use a second public IP with TLS passthrough for agents,
# or nginx stream SNI passthrough on 443 with separate hostnames/upstreams.
# Never forward untrusted certificate identity headers to the server.
